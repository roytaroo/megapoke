function renderEnergyDots(energyArr){
  return energyArr.map(t => `<img class="energy-dot" src="${ENERGY_IMG[t]}" alt="${t}">`).join('');
}
function renderAttackList(cardDef, energyAttached, compact){
  if(compact){
    return cardDef.attacks.map(atk => {
      const costIcons = atk.cost.map(t => `<img class="energy-dot small" src="${ENERGY_IMG[t]}" alt="${t}">`).join('');
      return `<div class="atk-line">${costIcons} <b>${atk.name}</b></div>`;
    }).join('');
  }
  return cardDef.attacks.map(atk => {
    const costIcons = atk.cost.map(t => `<img class="energy-dot small" src="${ENERGY_IMG[t]}" alt="${t}">`).join('');
    const payable = energyAttached ? canPayCost(energyAttached, atk.cost) : null;
    const mark = payable === null ? '' : (payable ? ' <span style="color:var(--hp-green);">✓使える</span>' : ' <span style="color:var(--text-dim);">✗コスト不足</span>');
    const coinCountLabel = atk.coin ? (atk.coin.countMode === 'boardCount' ? '場の枚数' : `×${atk.coin.count}`) : '';
    const coinTag = atk.coin ? ` <span class="status-badge coin-tag">🪙${coinCountLabel}</span>` : '';
    const dmgLabel = atk.attackEffect === 'attachBenchEnergy'
      ? `ベンチに${atk.energyType}エネルギーを付与`
      : (atk.coin && atk.coin.type === 'perHeads') ? `表の数×${atk.coin.amount}ダメージ` : `${atk.dmg}ダメージ`;
    const inflictTag = atk.inflicts ? ` <span class="status-badge status-${atk.inflicts}">${STATUS_LABEL[atk.inflicts]}付与</span>` : '';
    const splashTag = atk.benchSplash ? ` <span class="status-badge coin-tag">相手ベンチ全体に${atk.benchSplash.amount}</span>` : '';
    const discardTag = atk.discardDefenderEnergy ? ` <span class="status-badge coin-tag">相手のエネルギーを1個トラッシュ</span>` : '';
    const shieldTag = atk.selfShield ? ` <span class="status-badge ability-tag">🛡️次の相手ターン-${atk.selfShield.amount}</span>` : '';
    const koTag = atk.coinKO ? ` <span class="status-badge coin-tag">🪙${atk.coinKO.count}回中${atk.coinKO.threshold}回以上表で即きぜつ</span>` : '';
    return `<div class="atk-line">${costIcons} <b>${atk.name}</b> ${dmgLabel}${coinTag}${inflictTag}${splashTag}${discardTag}${shieldTag}${koTag}${mark}</div>`;
  }).join('');
}
const STATUS_LABEL = { poison:'どく', burn:'やけど', paralysis:'まひ', sleep:'ねむり', confusion:'こんらん' };
const RARITY_LABEL = {
  diamond1:'◇', diamond2:'◇◇', diamond3:'◇◇◇', diamond4:'◇◇◇◇',
  star1:'☆', star2:'☆☆', star3:'☆☆☆',
  crown:'👑', spade:'♠', club:'♣', dopa:'DOPA', promo:'PROMO'
};
const RARITY_NAME = {
  diamond1:'ダイヤ1', diamond2:'ダイヤ2', diamond3:'ダイヤ3', diamond4:'ダイヤ4',
  star1:'星1', star2:'星2', star3:'星3(イマーシブ)',
  crown:'クラウン', spade:'スペード(色違い)', club:'クラブ(色違い)',
  dopa:'ドパレア', promo:'プロモ'
};
function rarityBadge(printOrCard){
  const r = printOrCard.rarity;
  if(!r) return '';
  return `<span class="status-badge rarity-${r}" title="${RARITY_NAME[r]}">${RARITY_LABEL[r]}</span>`;
}
function renderAbilityLine(card){
  if(!card.ability) return '';
  const timingLabel = { onPlay:'場に出た時', passive:'常時', activated:'ターン1回' }[card.ability.timing] || '';
  return `<div class="ability-line"><span class="status-badge ability-tag">特性・${timingLabel}</span> <b>${card.ability.name}</b><div class="sub">${card.ability.desc}</div></div>`;
}
function renderActiveCard(activeObj, ownerLabel, showAttacks){
  if(!activeObj) return `<div class="empty-slot">${ownerLabel}: 場にカードがいない</div>`;
  if(activeObj.hidden && ownerLabel === '相手'){
    return `<div class="board-card card-back-slot"><div class="card-back-face">配置済み(裏向き)</div></div>`;
  }
  const card = CARDS[activeObj.cardId];
  const pct = Math.max(0, Math.round((activeObj.hp / activeObj.maxHp) * 100));
  const statusBadge = activeObj.status ? `<span class="status-badge status-${activeObj.status}">${STATUS_LABEL[activeObj.status]}</span>` : '';
  const shieldBadge = activeObj.shield > 0 ? `<span class="status-badge ability-tag">🛡️-${activeObj.shield}</span>` : '';
  const attackBlock = showAttacks ? `<div class="atk-list">${renderAttackList(card, activeObj.energy)}</div>` : '';
  const abilityBlock = renderAbilityLine(card);

  if(card.image){
    return `
      <div class="board-card big">
        <img class="card-art-full" src="${card.image}" alt="${card.name}" onclick="event.stopPropagation(); openCardViewer('${card.id}');">
        <div style="width:100%;">
          <span class="type-badge type-${card.type}">${card.type}</span>
          ${rarityBadge(card)}
          <span class="name">${card.name}</span>
          ${statusBadge}${shieldBadge}
          <div class="sub">HP ${activeObj.hp} / ${activeObj.maxHp}</div>
          <div class="hp-bar-outer"><div class="hp-bar-inner ${pct<=30?'low':''}" style="width:${pct}%"></div></div>
          <div class="sub" style="margin-top:6px;">エネルギー: ${activeObj.energy.length ? renderEnergyDots(activeObj.energy) : 'なし'}</div>
          ${abilityBlock}
          ${attackBlock}
        </div>
      </div>`;
  }
  return `
    <div class="board-card">
      <div style="flex:1;">
        <span class="type-badge type-${card.type}">${card.type}</span>
        ${rarityBadge(card)}
        <span class="name">${card.name}</span>
        ${statusBadge}${shieldBadge}
        <div class="sub">HP ${activeObj.hp} / ${activeObj.maxHp}</div>
        <div class="hp-bar-outer"><div class="hp-bar-inner ${pct<=30?'low':''}" style="width:${pct}%"></div></div>
        <div class="sub" style="margin-top:6px;">エネルギー: ${activeObj.energy.length ? renderEnergyDots(activeObj.energy) : 'なし'}</div>
        ${abilityBlock}
        ${attackBlock}
      </div>
    </div>`;
}

function renderBench(benchArr, slotsToShow, isOpponent){
  let html = '';
  for(let i=0;i<slotsToShow;i++){
    const b = benchArr[i];
    if(!b){ html += `<div class="bench-empty">空き</div>`; continue; }
    if(b.hidden && isOpponent){
      html += `<div class="bench-card card-back-slot" data-bench-idx="${i}"></div>`;
      continue;
    }
    const card = CARDS[b.cardId];
    html += `
      <div class="bench-card" data-bench-idx="${i}">
        <span class="type-badge type-${card.type}">${card.type}</span>
        <div class="bname">${card.name}</div>
        <div>HP ${b.hp}/${b.maxHp}</div>
        <div>${b.energy.length ? renderEnergyDots(b.energy) : ''}</div>
      </div>`;
  }
  return html;
}

const prevActiveId = { me: undefined, opp: undefined };
let lastShownDrawnSig = null;
function checkKoFlash(who, activeObj){
  const curId = activeObj ? activeObj.cardId : null;
  const prevId = prevActiveId[who];
  const flashed = (prevId !== undefined && prevId !== null && curId === null);
  prevActiveId[who] = curId;
  return flashed;
}
function render(){
  if(!currentState || !currentState.players) return;
  const state = currentState;
  const me = state.players[MY_SLOT];
  const opp = state.players[otherSlot(MY_SLOT)];
  const myTurn = state.activePlayer === MY_SLOT && state.phase === 'playing';
  if(!myTurn) pendingTarget = null;

  document.getElementById('myPoints').textContent = me.points;
  document.getElementById('oppPoints').textContent = opp.points;

  const isSetupPhase = state.phase === 'setup';
  const banner = document.getElementById('turnBanner');
  if(isSetupPhase){
    banner.textContent = me.setupReady ? '相手の配置を待ってるよ…' : 'たねメガモンを裏側で配置してね';
    banner.className = 'turn-banner ' + (me.setupReady ? 'theirs' : 'mine');
  }else{
    banner.textContent = state.phase === 'finished' ? '対戦終了' : (myTurn ? 'あなたのターン' : '相手のターン');
    banner.className = 'turn-banner ' + (myTurn ? 'mine' : 'theirs');
  }

  const dcBanner = document.getElementById('disconnectBanner');
  const isStale = oppLastSeen && (Date.now() - new Date(oppLastSeen).getTime()) > 15000;
  dcBanner.innerHTML = (isStale && state.phase === 'playing')
    ? `<div class="disconnect-banner">⚠️ 相手からの反応が15秒以上ありません(通信が切れたかも)</div>`
    : '';

  const oppFlash = checkKoFlash('opp', opp.active);
  const myFlash = checkKoFlash('me', me.active);
  const oppBoardEl = document.getElementById('oppBoard');
  const myBoardEl = document.getElementById('myBoard');
  oppBoardEl.innerHTML = renderActiveCard(opp.active, '相手', true);
  myBoardEl.innerHTML = renderActiveCard(me.active, '自分', false);
  if(oppFlash){
    const el = oppBoardEl.firstElementChild;
    if(el){ el.classList.add('ko-flash'); setTimeout(() => el.classList.remove('ko-flash'), 1000); }
  }
  if(myFlash){
    const el = myBoardEl.firstElementChild;
    if(el){ el.classList.add('ko-flash'); setTimeout(() => el.classList.remove('ko-flash'), 1000); }
  }

  maybeShowCoinOverlay('me', me.lastCoinFlip);
  maybeShowCoinOverlay('opp', opp.lastCoinFlip);
  maybeShowCoinOverlay('game', state.firstPlayerCoinFlip);

  const oppBenchEl = document.getElementById('oppBench');
  oppBenchEl.innerHTML = renderBench(opp.bench, 3, true);

  const isAwaitingTarget = myTurn && !!pendingTarget;
  const allowsActiveTarget = isAwaitingTarget && (
    (pendingTarget.type === 'ability' && pendingTarget.allowActive) ||
    (pendingTarget.type === 'energy' && pendingTarget.allowActive) ||
    (pendingTarget.type === 'attack' && me.active && CARDS[me.active.cardId].attacks[pendingTarget.idx] && CARDS[me.active.cardId].attacks[pendingTarget.idx].allowActiveTarget)
  );
  function resolvePendingTarget(fieldTarget){
    const target = pendingTarget;
    pendingTarget = null;
    if(target.type === 'ability'){
      useAbility(currentState, MY_SLOT, fieldTarget);
      pushState(); render();
    }else if(target.type === 'energy'){
      attachEnergy(currentState, MY_SLOT, fieldTarget);
      pushState(); render();
    }else if(target.type === 'attack'){
      const s = currentState;
      doAttack(s, MY_SLOT, target.idx, fieldTarget.idx);
      if(s.phase === 'playing') endTurn(s);
      pushState(); render();
    }
  }
  if(myBoardEl._captureClickHandler){
    myBoardEl.removeEventListener('click', myBoardEl._captureClickHandler, true);
    myBoardEl._captureClickHandler = null;
  }
  if(allowsActiveTarget && me.active){
    myBoardEl.style.cursor = 'pointer';
    myBoardEl.style.outline = '2px solid var(--gold)';
    myBoardEl.style.borderRadius = '14px';
    const activeTargetHandler = (e) => {
      e.stopPropagation();
      resolvePendingTarget({ where:'active' });
    };
    myBoardEl.addEventListener('click', activeTargetHandler, true);
    myBoardEl._captureClickHandler = activeTargetHandler;
  }else if(isSetupPhase && !me.setupReady && me.active){
    myBoardEl.style.cursor = 'pointer';
    myBoardEl.style.outline = '2px dashed var(--gold)';
    myBoardEl.style.borderRadius = '14px';
    const undoHandler = (e) => {
      e.stopPropagation();
      undoSetupBasic(currentState, MY_SLOT, 'active', null);
      pushState(); render();
    };
    myBoardEl.addEventListener('click', undoHandler, true);
    myBoardEl._captureClickHandler = undoHandler;
  }else{
    myBoardEl.style.cursor = '';
    myBoardEl.style.outline = '';
  }

  const canDoRetreat = myTurn && !!me.active && !me.retreatedThisTurn && !isAwaitingTarget;
  const myBenchEl = document.getElementById('myBench');
  myBenchEl.innerHTML = renderBench(me.bench, 3);
  if(isSetupPhase && !me.setupReady){
    myBenchEl.querySelectorAll('.bench-card').forEach(el => {
      const idx = parseInt(el.dataset.benchIdx, 10);
      if(!me.bench[idx]) return;
      el.classList.add('clickable');
      el.addEventListener('click', () => {
        undoSetupBasic(currentState, MY_SLOT, 'bench', idx);
        pushState(); render();
      });
    });
  }
  const needsMyPromote = !me.active && me.bench.some(Boolean) && state.phase === 'playing';
  if(needsMyPromote){
    myBenchEl.querySelectorAll('.bench-card').forEach(el => {
      const idx = parseInt(el.dataset.benchIdx, 10);
      if(!me.bench[idx]) return;
      el.classList.add('clickable');
      el.addEventListener('click', () => {
        doPromote(currentState, MY_SLOT, idx);
        pushState(); render();
      });
    });
    const hint = document.createElement('div');
    hint.className = 'sub';
    hint.style.marginTop = '6px';
    hint.textContent = 'メガモンがきぜつしたよ。ベンチから次に出すメガモンを選んでね';
    myBenchEl.appendChild(hint);
  }
  const isTargetingOppBench = isAwaitingTarget && pendingTarget.type === 'attack' && pendingTarget.oppBench;
  if(isAwaitingTarget && !isTargetingOppBench){
    myBenchEl.querySelectorAll('.bench-card').forEach(el => {
      const idx = parseInt(el.dataset.benchIdx, 10);
      if(!me.bench[idx]) return;
      el.classList.add('clickable');
      el.addEventListener('click', () => resolvePendingTarget({ where:'bench', idx }));
    });
    const hint = document.createElement('div');
    hint.className = 'sub';
    hint.style.marginTop = '6px';
    hint.textContent = allowsActiveTarget ? 'アクティブかベンチをタップして対象を選んでね' : 'ベンチをタップして対象を選んでね';
    myBenchEl.appendChild(hint);
  }
  if(isTargetingOppBench){
    oppBenchEl.querySelectorAll('.bench-card').forEach(el => {
      const idx = parseInt(el.dataset.benchIdx, 10);
      if(!opp.bench[idx]) return;
      el.classList.add('clickable');
      el.addEventListener('click', () => resolvePendingTarget({ where:'bench', idx }));
    });
    const hint = document.createElement('div');
    hint.className = 'sub';
    hint.style.marginTop = '6px';
    hint.textContent = '相手のベンチをタップして対象を選んでね(コインが裏だと不発)';
    oppBenchEl.appendChild(hint);
  }
  if(canDoRetreat){
    myBenchEl.querySelectorAll('.bench-card').forEach(el => {
      const idx = parseInt(el.dataset.benchIdx, 10);
      if(canRetreat(state, MY_SLOT, idx)){
        el.classList.add('clickable');
        el.addEventListener('click', () => {
          doRetreat(currentState, MY_SLOT, idx);
          pushState(); render();
        });
      }
    });
  }
  if(canDoRetreat && me.bench.some(b=>b)){
    const hint = document.createElement('div');
    hint.className = 'sub';
    hint.style.marginTop = '6px';
    const cost = me.active ? effectiveRetreatCost(state, MY_SLOT) : 0;
    hint.textContent = `ベンチをタップすると交代できる(1ターン1回・エネルギー${cost}個消費)`;
    myBenchEl.appendChild(hint);
  }

  // pending energy
  const peBox = document.getElementById('pendingEnergyBox');
  let peHtml = '';
  if(myTurn && me.pendingEnergy){
    peHtml += `<div class="sub">今ターンのエネルギー: <img class="energy-dot" src="${ENERGY_IMG[me.pendingEnergy]}" alt="${me.pendingEnergy}">${me.pendingEnergy}</div>`;
  }
  if(state.phase === 'playing' && me.nextEnergy){
    peHtml += `<div class="sub">次のターンのエネルギー: <img class="energy-dot" src="${ENERGY_IMG[me.nextEnergy]}" alt="${me.nextEnergy}">${me.nextEnergy}</div>`;
  }
  peBox.innerHTML = peHtml;

  // opponent's hand (face-down fan)
  const oppHandEl = document.getElementById('oppHandRow');
  oppHandEl.innerHTML = '';
  const oppHandN = opp.hand.length;
  for(let i=0;i<oppHandN;i++){
    const back = document.createElement('div');
    back.className = 'opp-hand-card';
    const mid = (oppHandN-1)/2;
    const off = i - mid;
    back.style.setProperty('--rot', `${off*5}deg`);
    back.style.zIndex = i;
    oppHandEl.appendChild(back);
  }

  // hand
  const handRow = document.getElementById('handRow');
  handRow.innerHTML = '';
  const drawnBanner = document.getElementById('drawnBanner');
  if(me.lastDrawn){
    const drawnSig = state.turn + ':' + MY_SLOT + ':' + me.lastDrawn;
    const isFreshDraw = drawnSig !== lastShownDrawnSig;
    lastShownDrawnSig = drawnSig;
    const dCard = CARDS[me.lastDrawn];
    const badge = dCard.kind === 'creature'
      ? `<span class="type-badge type-${dCard.type}">${dCard.type}</span>`
      : `<span class="type-badge trainer-badge-${dCard.kind}">${dCard.trainerType}</span>`;
    drawnBanner.innerHTML = `<div class="drawn-banner${isFreshDraw ? ' just-drawn' : ''}"><span class="deck-pile-mini"></span>${badge} ${dCard.name} を引いた</div>`;
  }else{
    drawnBanner.innerHTML = '';
    lastShownDrawnSig = null;
  }

  const handN = me.hand.length;
  const handMid = (handN-1)/2;
  me.hand.forEach((cardId, handIdx) => {
    const card = CARDS[cardId];
    const isTrainer = card.kind === 'item' || card.kind === 'support';
    const setupPlayable = isSetupPhase && !isTrainer && canPlaceSetupBasic(state, MY_SLOT, cardId);
    const playable = setupPlayable || (myTurn && (
      isTrainer ? canPlayTrainer(state, MY_SLOT, cardId)
                : (canPlayBasic(state, MY_SLOT, cardId) || canKaika(state, MY_SLOT, cardId))
    ));
    const div = document.createElement('div');
    div.className = 'hand-card' + (playable ? ' playable' : '');
    const handOff = handIdx - handMid;
    div.style.setProperty('--rot', `${handOff*4}deg`);
    div.style.setProperty('--lift', `${Math.abs(handOff)*5}px`);
    div.style.zIndex = handIdx;
    if(isTrainer){
      div.innerHTML = `
        <span class="type-badge trainer-badge-${card.kind}">${card.trainerType}</span>
        ${rarityBadge(card)}
        <div class="hname">${card.name}</div>
        <div class="hstats">${card.desc}</div>
      `;
    }else{
      const artImg = card.image ? `<img class="card-art-thumb" src="${card.image}" alt="${card.name}" onclick="event.stopPropagation(); openCardViewer('${card.id}');">` : '';
      if(card.image){
        div.innerHTML = artImg;
      }else{
        div.innerHTML = `
          <span class="type-badge type-${card.type}">${card.type}</span>
          ${rarityBadge(card)}
          <div class="hname">${card.name}</div>
          <div class="hstats">HP${card.hp} ${card.basic ? '(基本)' : '(怪化)'}</div>
          ${renderAbilityLine(card)}
          <div class="atk-list">${renderAttackList(card, null, true)}</div>
        `;
      }
    }
    const doPlayAction = () => {
      const s = currentState;
      if(setupPlayable){
        if(canPlaceSetupBasic(s, MY_SLOT, cardId)){
          placeSetupBasic(s, MY_SLOT, cardId);
          pushState(); render();
        }
      }else if(playable){
        if(isTrainer){
          if(canPlayTrainer(s, MY_SLOT, cardId)) playTrainer(s, MY_SLOT, cardId);
        }else if(canPlayBasic(s, MY_SLOT, cardId)){
          playBasic(s, MY_SLOT, cardId);
        }else if(canKaika(s, MY_SLOT, cardId)){
          doKaika(s, MY_SLOT, cardId);
        }
        pushState(); render();
      }
    };
    // マウス操作用フォールバック(タッチ端末ではtouchendでpreventDefaultして二重発火を防ぐ)
    if(setupPlayable || playable) div.addEventListener('click', doPlayAction);
    // タッチ操作: 長押しで画面いっぱいにプレビュー、上スワイプで繰り出す(発動できるカードのみ)、離すだけなら元に戻る
    let touchStartY = null;
    let swiped = false;
    let previewShown = false;
    div.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
      swiped = false;
      div.classList.add('lifted');
      previewShown = showTouchPreview(cardId);
    }, { passive: true });
    div.addEventListener('touchmove', (e) => {
      if(touchStartY === null) return;
      e.preventDefault(); // カード操作中はページ側のスクロールを止める
      const dy = e.touches[0].clientY - touchStartY;
      const canSwipe = setupPlayable || playable;
      if(canSwipe && dy < -40){
        if(!swiped){
          swiped = true;
          div.classList.add('swiping');
          if(previewShown) setSwipeHint('↑ はなすと繰り出す');
        }
      }else if(swiped){
        swiped = false;
        div.classList.remove('swiping');
        if(previewShown) setSwipeHint('');
      }
    }, { passive: false });
    div.addEventListener('touchend', (e) => {
      div.classList.remove('lifted');
      div.classList.remove('swiping');
      touchStartY = null;
      if(previewShown){ hideTouchPreview(); previewShown = false; }
      const canSwipe = setupPlayable || playable;
      if(canSwipe) e.preventDefault(); // タッチ操作ではクリックの疑似発火を常に抑止し、スワイプでのみ発動させる
      if(swiped){
        swiped = false;
        doPlayAction();
      }
    });
    div.addEventListener('touchcancel', () => {
      div.classList.remove('lifted');
      div.classList.remove('swiping');
      touchStartY = null;
      swiped = false;
      if(previewShown){ hideTouchPreview(); previewShown = false; }
    });
    handRow.appendChild(div);
  });

  // actions
  const actionRow = document.getElementById('actionRow');
  actionRow.innerHTML = '';
  if(isSetupPhase && !me.setupReady){
    if(me.active){
      const readyBtn = document.createElement('button');
      readyBtn.className = 'primary';
      readyBtn.textContent = '準備完了';
      readyBtn.addEventListener('click', () => {
        markSetupReady(currentState, MY_SLOT);
        pushState();
        render();
      });
      actionRow.appendChild(readyBtn);
    }
    const hint = document.createElement('div');
    hint.className = 'sub';
    hint.style.marginTop = '6px';
    hint.textContent = me.active
      ? '自分のバトル場/ベンチをタップすると配置を取り消せるよ'
      : 'まずはたねメガモンをバトル場に1体配置してね(タップで配置)';
    actionRow.appendChild(hint);
  }
  if(myTurn && state.phase === 'playing'){
    if(canAttachEnergy(state, MY_SLOT)){
      const b = document.createElement('button');
      b.className = 'ghost';
      const isTargeting = pendingTarget && pendingTarget.type === 'energy';
      b.textContent = isTargeting ? 'エネルギーを付ける: 対象をタップ' : 'エネルギーを付ける';
      b.addEventListener('click', () => {
        pendingTarget = { type:'energy', allowActive: !!me.active };
        render();
      });
      actionRow.appendChild(b);
    }
    if(canUseAbility(state, MY_SLOT)){
      const b = document.createElement('button');
      b.className = 'ghost';
      const abDef = CARDS[me.active.cardId].ability;
      const isTargeting = pendingTarget && pendingTarget.type === 'ability';
      const needsBenchTarget = abDef.effect === 'attachBenchEnergy';
      const needsFieldTarget = abDef.effect === 'healOwnField10';
      b.textContent = isTargeting ? `${abDef.name}: 対象をタップ` : `特性: ${abDef.name}`;
      b.addEventListener('click', () => {
        if(needsBenchTarget || needsFieldTarget){
          pendingTarget = { type:'ability', allowActive: needsFieldTarget };
          render();
        }else{
          useAbility(currentState, MY_SLOT);
          pushState(); render();
        }
      });
      actionRow.appendChild(b);
    }
    if(me.active){
      const card = CARDS[me.active.cardId];
      card.attacks.forEach((atk, idx) => {
        const b = document.createElement('button');
        const usable = canAttack(state, MY_SLOT, idx);
        const costIcons = atk.cost.map(t => `<img class="energy-dot small" src="${ENERGY_IMG[t]}" alt="${t}">`).join('');
        const isTargeting = pendingTarget && pendingTarget.type === 'attack' && pendingTarget.idx === idx;
        const dmgLabel = atk.attackEffect === 'attachBenchEnergy' ? '' : ((atk.coin && atk.coin.type === 'perHeads') ? `表×${atk.coin.amount}` : `(${atk.dmg})`);
        b.innerHTML = isTargeting ? `${atk.name}: ベンチをタップ` : `${costIcons} ${atk.name}${dmgLabel}`;
        b.disabled = !usable;
        b.addEventListener('click', () => {
          if(atk.attackEffect === 'attachBenchEnergy' && me.bench.some(b=>b)){
            pendingTarget = { type:'attack', idx };
            render();
            return;
          }
          if(atk.coinBenchDamage && opp.bench.some(b=>b)){
            pendingTarget = { type:'attack', idx, oppBench:true };
            render();
            return;
          }
          const s = currentState;
          doAttack(s, MY_SLOT, idx);
          if(s.phase === 'playing') endTurn(s);
          pushState();
          render();
        });
        actionRow.appendChild(b);
      });
    }
    const endBtn = document.createElement('button');
    endBtn.className = 'ghost';
    endBtn.textContent = 'ターンを終える';
    endBtn.addEventListener('click', () => { endTurn(currentState); pushState(); render(); });
    actionRow.appendChild(endBtn);
  }

  // log
  const logBox = document.getElementById('logBox');
  logBox.innerHTML = (state.log || []).slice().reverse().map(l => `<div>${l}</div>`).join('');

  // win overlay
  const overlay = document.getElementById('winOverlay');
  if(state.phase === 'finished'){
    overlay.classList.add('show');
    document.getElementById('winText').textContent =
      state.winner === MY_SLOT ? 'あなたの勝ち！' : 'あなたの負け…';
  }else{
    overlay.classList.remove('show');
  }
}

const ALL_CARD_IDS = Object.keys(CARDS);

const PACKS = {
  pack_psychic: { id:'pack_psychic', name:'ヒラメキ飯店', code:'A1a', type:'超', image:'https://kbsdvtjkczhnggamnggd.supabase.co/storage/v1/object/public/card-images/Untitled%20design.png' },
  pack_dark: { id:'pack_dark', name:'曲者スパイラル', code:'A1a', type:'悪', image:'https://kbsdvtjkczhnggamnggd.supabase.co/storage/v1/object/public/card-images/C7E07075-1C33-4719-96D1-532329B70F31.png' },
  pack_fighting: { id:'pack_fighting', name:'熱血ワンダホー', code:'A1a', type:'格闘', image:'https://kbsdvtjkczhnggamnggd.supabase.co/storage/v1/object/public/card-images/71AA5DAF-EC28-4B53-B5C7-7F325009BF71.png' },
};
function exclusivePoolFor(packType, packId){
  return ALL_PRINT_IDS.filter(id => {
    const c = printCard(id);
    if(!c || c.kind !== 'creature') return false;
    const print = PRINTS[id];
    // このPRINTが特定パック専用に指定されてたら、そのパックでだけ出す(タイプ一致は問わない)
    if(print.packId) return print.packId === packId;
    // 指定が無ければ通常通りタイプ一致。無色タイプは全パック共通で出す。
    return c.type === packType || c.type === '無色';
  });
}

async function refreshStatsPage(){
  const rankEl = document.getElementById('statsRanking');
  const histEl = document.getElementById('statsHistory');
  rankEl.innerHTML = loadingHTML();
  histEl.innerHTML = '';
  const ok = await ensureSb();
  if(!ok){ rankEl.innerHTML = errorBannerHTML(); return; }
  try{
    const { data, error } = await sb.from('megapoke_match_history')
      .select('*').order('finished_at', { ascending: false }).limit(50);
    if(error) throw error;
    const rows = data || [];
    const wins = {};
    rows.forEach(r => {
      if(r.winner_name) wins[r.winner_name] = (wins[r.winner_name] || 0) + 1;
    });
    const ranking = Object.entries(wins).sort((a,b) => b[1]-a[1]);
    rankEl.innerHTML = ranking.length
      ? ranking.map(([name,n]) => `<div class="atk-line">${name} : <b>${n}勝</b></div>`).join('')
      : '<div class="sub">まだ対戦記録がないよ</div>';
    histEl.innerHTML = rows.length
      ? rows.map(r => {
          const d = new Date(r.finished_at);
          const dateStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
          const p1 = r.player1_name || '?';
          const p2 = r.player2_name || '?';
          const winner = r.winner_name || '?';
          return `<div class="atk-line">${dateStr} ${p1} vs ${p2} → <b>${winner}</b>の勝ち</div>`;
        }).join('')
      : '';
  }catch(e){
    rankEl.innerHTML = '読み込みに失敗した';
  }
}

const FREE_PACKS = 3;

const REDEEM_CODES = {
  'OKANISAGODDESS': { packs: 3, promoPrintId: 'promo_launch_p' },
};
async function redeemCode(rawCode){
  const name = getMyName();
  if(!name) return { ok:false, msg:'名前を選んでから使ってね' };
  const code = (rawCode || '').trim().toUpperCase();
  const def = REDEEM_CODES[code];
  if(!def) return { ok:false, msg:'そのコードは見つからなかった' };
  const ok = await ensureSb();
  if(!ok) return { ok:false, msg:'接続できなかった。もう一度試してね' };
  try{
    const { data: existing } = await sb.from('megapoke_redeemed_codes')
      .select('*').eq('player_name', name).eq('code', code).maybeSingle();
    if(existing) return { ok:false, msg:'このコードはもう使用済みだよ' };
    const row = await getCollectionRow();
    const cards = row.cards || {};
    if(def.promoPrintId) cards[def.promoPrintId] = (cards[def.promoPrintId] || 0) + 1;
    const newBonus = (row.bonus_packs || 0) + (def.packs || 0);
    await saveCollection(cards, { bonus_packs: newBonus });
    await sb.from('megapoke_redeemed_codes').insert({ player_name: name, code });
    return { ok:true, msg:`コード適用！ボーナスパック${def.packs}回分と、プロモカードをゲットしたよ` };
  }catch(e){
    return { ok:false, msg:'エラーが起きた。もう一度試してね' };
  }
}

async function getCollectionRow(){
  const name = getMyName();
  if(!sb || !name) return { cards: {}, packs_opened_total: 0, last_pack_date: null };
  try{
    const { data } = await sb.from('megapoke_collections').select('*').eq('player_name', name).maybeSingle();
    return data || { cards: {}, packs_opened_total: 0, last_pack_date: null };
  }catch(e){ return { cards: {}, packs_opened_total: 0, last_pack_date: null }; }
}
async function getCollection(){
  const row = await getCollectionRow();
  return row.cards || {};
}
async function saveCollection(cards, extra){
  const name = getMyName();
  if(!sb || !name) return;
  try{
    await sb.from('megapoke_collections').upsert(
      { player_name: name, cards, updated_at: new Date().toISOString(), ...(extra||{}) },
      { onConflict: 'player_name' }
    );
  }catch(e){ /* ignore */ }
}
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function printLabel(printId){
  const card = printCard(printId);
  const print = PRINTS[printId];
  const base = card.kind === 'creature' ? `${card.name}(${card.type})` : `${card.name}【${card.trainerType}】`;
  return rarityBadge(print) + ' ' + base;
}
function loadingHTML(text){
  return `<div class="loading-row"><span class="spinner"></span>${text || '読み込み中…'}</div>`;
}
function errorBannerHTML(text){
  return `<div class="error-banner"><span class="err-icon">⚠️</span><div class="err-body">${text || '接続できませんでした。時間をおいて試してね。'}</div></div>`;
}

async function refreshCollectionView(){
  const ok = await ensureSb();
  if(!ok) return;
  const row = await getCollectionRow();
  renderPackSelectGrid(row);
}

function packLimitLabel(row){
  const bonus = row.bonus_packs || 0;
  if(bonus > 0) return `ボーナスパック: 残り${bonus}回`;
  const opened = row.packs_opened_total || 0;
  if(opened < FREE_PACKS) return `初回無料パック: 残り${FREE_PACKS - opened}回`;
  if(row.last_pack_date === todayStr()) return '今日はもう開封済み。また明日どうぞ。';
  return '今日のパックを開ける(1日1回)';
}
function canOpenPack(row){
  if((row.bonus_packs || 0) > 0) return true;
  const opened = row.packs_opened_total || 0;
  if(opened < FREE_PACKS) return true;
  return row.last_pack_date !== todayStr();
}

function renderPackSelectGrid(row){
  document.getElementById('packLimitStatus').textContent = packLimitLabel(row);
  const grid = document.getElementById('packSelectGrid');
  const openable = canOpenPack(row);
  grid.innerHTML = Object.values(PACKS).map(pack => `
    <div class="pack-card">
      <img src="${pack.image}" alt="${pack.name}">
      <div class="pname">${pack.name}<br><span class="sub">${pack.type}タイプ中心</span></div>
      <button type="button" class="pack-open-btn" data-pack="${pack.id}" ${openable ? '' : 'disabled'}>開ける(5枚)</button>
    </div>
  `).join('');
  grid.querySelectorAll('.pack-open-btn').forEach(btn => {
    btn.addEventListener('click', () => openPack(btn.dataset.pack));
  });
}

/* 本家ポケポケのパック確率(公表値ベース)。1〜3枚目は確定でダイヤ1、
   4枚目・5枚目はこの表の通りに抽選する。DOPAはMEGAPOKEオリジナル枠として追加
   (合計0.1%になるよう、クラウンと同じ4:1の配分で4枚目0.02%/5枚目0.08%)。 */
const SLOT_RARITY_WEIGHTS = {
  4: { diamond2:89, diamond3:4.952, diamond4:1.666, star1:2.572, star2:0.5, star3:0.222, spade:0.714, club:0.333, crown:0.04, dopa:0.02 },
  5: { diamond2:56, diamond3:19.81, diamond4:6.664, star1:10.288, star2:2, star3:0.888, spade:2.857, club:1.333, crown:0.16, dopa:0.08 },
};
function pickTierWeighted(weights, availableTiers){
  const entries = Object.entries(weights).filter(([tier,w]) => w > 0 && availableTiers.has(tier));
  if(entries.length === 0) return null;
  const total = entries.reduce((s,[,w]) => s+w, 0);
  let r = Math.random() * total;
  for(const [tier,w] of entries){
    if(r < w) return tier;
    r -= w;
  }
  return entries[entries.length-1][0];
}
function drawPackCards(packType, packId){
  // TODO: カードが全部揃ったら「このパックから出るカード」を明示リストに差し替える。
  // 今はタイプ限定プール(そのタイプの生き物カード、またはpackId指定のカード)の中でレア度抽選する暫定仕様。
  const pool = exclusivePoolFor(packType, packId);
  const byRarity = {};
  pool.forEach(pid => { const r = PRINTS[pid].rarity; (byRarity[r] = byRarity[r] || []).push(pid); });
  const diamond1Pool = (byRarity['diamond1'] && byRarity['diamond1'].length)
    ? byRarity['diamond1']
    : ALL_PRINT_IDS.filter(id => PRINTS[id].rarity === 'diamond1');

  const drawn = [];
  for(let i=0;i<3;i++){
    drawn.push(diamond1Pool[Math.floor(Math.random()*diamond1Pool.length)]);
  }
  const availableTiers = new Set(Object.keys(byRarity));
  [4,5].forEach(slotNum => {
    const tier = pickTierWeighted(SLOT_RARITY_WEIGHTS[slotNum], availableTiers);
    const candidates = (tier && byRarity[tier] && byRarity[tier].length) ? byRarity[tier] : diamond1Pool;
    drawn.push(candidates[Math.floor(Math.random()*candidates.length)]);
  });
  return drawn;
}

async function openPack(packId){
  const pack = PACKS[packId];
  if(!pack) return;
  const ok = await ensureSb();
  if(!ok){ document.getElementById('packReveal').innerHTML = errorBannerHTML(); return; }
  const row = await getCollectionRow();
  if(!canOpenPack(row)){
    document.getElementById('packLimitStatus').textContent = '今日はもう開封済み。また明日どうぞ。';
    return;
  }
  const opened = row.packs_opened_total || 0;
  const cards = row.cards || {};
  const drawn = drawPackCards(pack.type, pack.id);
  drawn.forEach(id => { cards[id] = (cards[id] || 0) + 1; });
  const useBonus = (row.bonus_packs || 0) > 0;
  const extraFields = useBonus
    ? { bonus_packs: row.bonus_packs - 1 }
    : { packs_opened_total: opened + 1, last_pack_date: todayStr() };
  await saveCollection(cards, extraFields);
  document.getElementById('packReveal').innerHTML = drawn.map(id => {
    const c = printCard(id);
    const print = PRINTS[id];
    const badge = c.kind === 'creature'
      ? `<span class="type-badge type-${c.type}">${c.type}</span>`
      : `<span class="type-badge trainer-badge-${c.kind}">${c.trainerType}</span>`;
    return `<div class="hand-card"><div>${badge} ${rarityBadge(print)}</div><div class="hname">${c.name}</div></div>`;
  }).join('');
  await refreshCollectionView();
}

async function refreshDeckBuilder(){
  const gridEl = document.getElementById('deckBuilderGrid');
  gridEl.innerHTML = loadingHTML();
  const ok = await ensureSb();
  if(!ok){ gridEl.innerHTML = errorBannerHTML(); return; }
  const name = getMyName();
  const owned = await getCollection(); // keyed by print id
  let savedDeck = []; // stored as CARD ids (battle-ready)
  let savedEnergyTypes = [];
  if(sb && name){
    try{
      const { data } = await sb.from('megapoke_decks').select('deck, energy_types').eq('player_name', name).maybeSingle();
      if(data && Array.isArray(data.deck)) savedDeck = data.deck;
      if(data && Array.isArray(data.energy_types)) savedEnergyTypes = data.energy_types;
    }catch(e){ /* ignore */ }
  }
  // convert saved CARD-id deck into a per-PRINT allocation (best-effort: fill whichever owned prints match each card)
  const deckCounts = {}; // keyed by print id
  const cardIdCounts = {};
  savedDeck.forEach(cid => { cardIdCounts[cid] = (cardIdCounts[cid] || 0) + 1; });
  Object.entries(cardIdCounts).forEach(([cardId, need]) => {
    const prints = printsForCard(cardId);
    let remaining = need;
    for(const pid of prints){
      if(remaining <= 0) break;
      const take = Math.min(remaining, owned[pid] || 0);
      if(take > 0){ deckCounts[pid] = take; remaining -= take; }
    }
  });

  const selectedEnergy = new Set(savedEnergyTypes);
  function renderEnergyPicker(){
    const pickerEl = document.getElementById('energyTypePicker');
    pickerEl.innerHTML = ENERGY_TYPES.map(t => `
      <button type="button" class="energy-type-btn ${selectedEnergy.has(t) ? 'selected' : ''}" data-etype="${t}">
        <img src="${ENERGY_IMG[t]}" alt="${t}">${t}
      </button>
    `).join('');
    pickerEl.querySelectorAll('.energy-type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = btn.dataset.etype;
        if(selectedEnergy.has(t)) selectedEnergy.delete(t);
        else if(selectedEnergy.size < 3) selectedEnergy.add(t);
        renderEnergyPicker();
      });
    });
  }
  renderEnergyPicker();

  function cardTotalInDeck(cardId){
    return printsForCard(cardId).reduce((sum, pid) => sum + (deckCounts[pid] || 0), 0);
  }
  function totalInDeck(){
    return Object.values(deckCounts).reduce((a,b) => a+b, 0);
  }
  function renderGrid(){
    const visibleIds = ALL_PRINT_IDS.filter(id => (owned[id] || 0) > 0);
    if(visibleIds.length === 0){
      gridEl.innerHTML = '<p class="sub">まだ所持カードが無いよ。パックを開けてね。</p>';
      document.getElementById('deckCount').textContent = 0;
      return;
    }
    gridEl.innerHTML = visibleIds.map(id => {
      const print = PRINTS[id];
      const c = printCard(id);
      const ownedN = owned[id] || 0;
      const inDeck = deckCounts[id] || 0;
      const art = printArt(id);
      const artHtml = art
        ? `<img src="${art}" alt="${c.name}" data-zoom-print="${id}">`
        : `<div class="no-art type-${c.type}">${c.name}</div>`;
      return `
        <div class="deck-card-tile" data-print="${id}">
          ${artHtml}
          ${rarityBadge(print)}
          <div class="dname">${c.name}</div>
          <div class="downed">所持${ownedN}</div>
          <div class="deck-qty-row">
            <button type="button" class="ghost deck-minus">−</button>
            <span class="deck-qty-num">${inDeck}</span>
            <button type="button" class="ghost deck-plus">＋</button>
          </div>
        </div>`;
    }).join('');
    document.getElementById('deckCount').textContent = totalInDeck();
    gridEl.querySelectorAll('[data-zoom-print]').forEach(img => {
      img.addEventListener('click', () => {
        const pid = img.dataset.zoomPrint;
        openCardViewer(PRINTS[pid].cardId, printArt(pid), printCard(pid).name);
      });
    });
    gridEl.querySelectorAll('.deck-plus').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.closest('[data-print]').dataset.print;
        const cardId = PRINTS[id].cardId;
        const ownedN = owned[id] || 0;
        const cur = deckCounts[id] || 0;
        const cardTotal = cardTotalInDeck(cardId);
        if(cur < ownedN && cardTotal < 2){
          deckCounts[id] = cur + 1;
          renderGrid();
        }
      });
    });
    gridEl.querySelectorAll('.deck-minus').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.closest('[data-print]').dataset.print;
        const cur = deckCounts[id] || 0;
        if(cur > 0){
          deckCounts[id] = cur - 1;
          renderGrid();
        }
      });
    });
  }
  renderGrid();

  document.getElementById('saveDeckBtn').onclick = async () => {
    // deckCounts is per-print; convert to CARD ids for the battle engine
    const deckArr = [];
    Object.entries(deckCounts).forEach(([printId,n]) => {
      const cardId = PRINTS[printId].cardId;
      for(let i=0;i<n;i++) deckArr.push(cardId);
    });
    const statusEl = document.getElementById('deckSaveStatus');
    if(!getMyName()){ statusEl.textContent = '名前を選んでから保存してね'; return; }
    if(selectedEnergy.size === 0){ statusEl.textContent = 'エネルギータイプを1つ以上選んでね'; return; }
    try{
      await sb.from('megapoke_decks').upsert({
        player_name: getMyName(), deck: deckArr, energy_types: Array.from(selectedEnergy), updated_at: new Date().toISOString()
      }, { onConflict: 'player_name' });
      statusEl.textContent = `保存したよ(${deckArr.length}枚)`;
    }catch(e){
      statusEl.textContent = '保存に失敗した';
    }
    setTimeout(() => { statusEl.textContent = ''; }, 3000);
  };
}

function openCardViewer(cardId, artOverride, nameOverride){
  const card = CARDS[cardId];
  const art = artOverride || (card && card.image);
  if(!art) return;
  const label = nameOverride || (card && card.name) || '';
  document.getElementById('cardViewerInner').innerHTML = `
    <img src="${art}" alt="${label}">
    <button class="card-viewer-close" id="cardViewerCloseBtn">閉じる</button>
  `;
  document.getElementById('cardViewer').classList.remove('hidden');
  document.getElementById('cardViewerCloseBtn').addEventListener('click', closeCardViewer);
}

  document.getElementById('cardViewer').classList.add('hidden');
}

/* ================= auto-rejoin on load (survives reload/refresh) ================= */
async function tryAutoRejoin(){
  const urlCode = new URL(location.href).searchParams.get('room');
  const code = urlCode || sessionStorage.getItem('megapoke_room_code');
  const slot = sessionStorage.getItem('megapoke_room_slot');
  if(!code || !slot) return;
  const ok = await ensureSb();
  if(!ok) return;
  try{
    const { data, error } = await sb.from('megapoke_rooms').select('*').eq('room_code', code).maybeSingle();
    if(error || !data) return;
    ROOM_CODE = code;
    MY_SLOT = slot;
    saveRoomSession(code, slot);
    subscribeRoom();
    startPolling();
    if(data.state && Object.keys(data.state).length){
      currentState = data.state;
      localStateVersion = data.updated_at || null;
      showGame();
      render();
    }else{
      showWaiting(code);
    }
  }catch(e){ /* couldn't rejoin; stay on landing */ }
}
tryAutoRejoin();
