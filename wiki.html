<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>メガポケ 公式Wiki</title>
<meta name="description" content="メガポケ(MEGAMI Trading Card Game Pocket)公式Wiki。カード一覧、ティアリスト、デッキレシピ、遊びかた、ルールを掲載しています。">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 構成はBOWFLIT 公式Wikiと同じ(英字見出し・ひし形の見出しマーク・角を切ったタイル)。配色は白基調 */
:root{
  --bg:#f5f5f9; --bg2:#ffffff; --bg3:#eeedf6; --line:rgba(30,28,60,.10); --line2:rgba(30,28,60,.22);
  --ink:#1e1c3a; --ink2:#44425f; --sub:#74728c; --accent:#8b4dff; --accent2:#6a34e0;
  --en:"Bebas Neue","Zen Kaku Gothic New",sans-serif; --ui:"Rajdhani","Zen Kaku Gothic New",sans-serif; --jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --t-格闘:#e8641c; --t-悪:#6450e0; --t-超:#d63d97; --t-無色:#7e8aa2; --t-tr:#1791c0;
  --rk-S:#e8455d; --rk-A:#e09a00; --rk-B:#1aa86b; --rk-C:#8792a8;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--jp);font-weight:500;font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:var(--accent2)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{display:block;max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 上のバー */
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;gap:14px;height:56px}
.brand{display:flex;align-items:baseline;gap:6px;text-decoration:none;flex:none;font-family:var(--en);font-size:22px;letter-spacing:.06em;line-height:1;color:var(--ink)}
.brand b{font-weight:400;color:var(--accent)}
header nav{display:flex;gap:20px;margin-left:auto}
header nav a{font-family:var(--ui);font-weight:700;font-size:14px;letter-spacing:.1em;color:var(--sub);text-decoration:none;white-space:nowrap}
header nav a:hover,header nav a.on{color:var(--ink)}
header nav a.play{color:var(--accent2)}
.search{position:relative;flex:0 1 190px;min-width:0}
.search input{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--bg3);border:1px solid transparent;border-radius:0;padding:6px 10px;-webkit-appearance:none}
.search input:focus{outline:none;border-color:var(--accent);background:#fff}
.menu-btn{display:none;width:38px;height:38px;border:1px solid var(--line2);background:transparent;color:var(--ink);cursor:pointer;flex:none;padding:0}
.menu-btn svg{width:18px;height:18px;display:block;margin:auto}
@media (max-width:1000px){
  header nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;gap:0;background:#fff;border-bottom:1px solid var(--line);padding:4px 16px 10px;margin:0;box-shadow:0 12px 24px rgba(30,28,60,.08)}
  header.open nav{display:flex}
  header nav a{padding:11px 0;border-bottom:1px solid var(--line)}
  header nav a:last-child{border-bottom:0}
  .search{margin-left:auto}
  .menu-btn{display:block}
}
.results{position:absolute;right:0;top:calc(100% + 6px);width:min(300px,84vw);background:#fff;border:1px solid var(--line2);z-index:40;max-height:60vh;overflow:auto;box-shadow:0 12px 28px rgba(30,28,60,.14)}
.results a{display:flex;gap:10px;align-items:center;padding:7px 10px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);font-size:14px;font-weight:700}
.results a:last-child{border-bottom:0}
.results a:hover{background:var(--bg)}
.results img,.results i{width:26px;height:36px;object-fit:cover;flex:none;background:var(--bg3);border-radius:2px}
.results small{color:var(--sub);margin-left:auto;white-space:nowrap;font-weight:500;font-size:12px}

/* 共通 */
main{min-height:70vh;padding-bottom:72px}
.crumb{font-family:var(--ui);font-weight:700;font-size:12.5px;letter-spacing:.12em;color:var(--sub);margin:20px 0 6px}
.crumb a{color:var(--sub);text-decoration:none}.crumb a:hover{color:var(--ink)}
h1.t{font-family:var(--en);font-weight:400;font-size:clamp(46px,8vw,88px);line-height:.92;margin:0 0 10px;letter-spacing:.02em}
h1.t i{font-style:normal;color:var(--accent)}
.lead{color:var(--sub);max-width:44em;margin:0 0 4px;font-size:14.5px}
h2.s{font-weight:900;font-size:18px;margin:38px 0 12px;display:flex;align-items:center;gap:10px;line-height:1.3}
h2.s::before{content:"";width:9px;height:9px;background:var(--accent);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);flex:none}
h2.s small{font-family:var(--ui);font-weight:700;font-size:11.5px;letter-spacing:.18em;color:var(--sub);text-transform:uppercase}
h2.s a{margin-left:auto;font-family:var(--ui);font-weight:700;font-size:12.5px;letter-spacing:.1em;text-decoration:none}
.box{background:var(--bg2);border:1px solid var(--line)}
.pad{padding:14px 16px}
.pad p{margin:0;color:var(--ink2)}
.pad ul{margin:0;padding-left:1.2em;color:var(--ink2)}
.pad li + li{margin-top:4px}
.empty{color:var(--sub)}
.pill{display:inline-block;font-family:var(--ui);font-weight:700;font-size:11.5px;letter-spacing:.1em;line-height:18px;padding:0 7px;border:1px solid var(--pc,var(--line2));color:var(--pc,var(--sub));white-space:nowrap;vertical-align:middle;text-decoration:none}
.pill.fill{background:var(--pc);color:#fff}
.tabs{display:flex;gap:6px;margin:0 0 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:.08em;border:1px solid var(--line2);background:#fff;color:var(--ink2);padding:5px 12px;cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* 表 */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:11.5px;font-weight:700;color:var(--sub);white-space:nowrap;background:var(--bg)}
.tbl td:first-child{font-weight:700;white-space:nowrap}
.tbl td{color:var(--ink2)}.tbl td:first-child{color:var(--ink)}
.tbl td.num{font-family:var(--en);font-size:19px;letter-spacing:.04em;white-space:nowrap;line-height:1.3;color:var(--ink)}
.tbl small{font-weight:500;color:var(--sub);font-size:12px;margin-left:4px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--bg2)}

/* カード */
.face{aspect-ratio:745/1040;position:relative;overflow:hidden;border-radius:4.5%/3.2%;background:var(--bg3);box-shadow:0 1px 2px rgba(30,28,60,.12),0 6px 14px rgba(30,28,60,.10)}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.face span{position:absolute;inset:0;display:grid;place-items:center;padding:8px;text-align:center;font-size:11px;font-weight:700;color:var(--sub);line-height:1.4}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 10px}
.cgrid.sm{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:12px 8px}
.c{position:relative;display:block;text-decoration:none;color:var(--ink);min-width:0}
.c .face{transition:transform .15s}
.c:hover .face{transform:translateY(-3px)}
.c b{display:block;font-size:12.5px;font-weight:700;line-height:1.35;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cgrid.sm .c b{font-size:11.5px}
.c .n{position:absolute;right:-3px;top:-5px;z-index:2;font-family:var(--en);font-size:16px;line-height:1;padding:3px 6px 1px;background:var(--ink);color:#fff}

/* ホーム */
.home-hero{padding:26px 0 0}
.home-hero .logo{width:168px;margin:0 0 10px -6px}
.fan{display:flex;justify-content:center;align-items:flex-end;margin:26px auto 8px;max-width:420px;padding:0 4%}
.fan a{width:36%;margin:0 -3%;transform:rotate(-7deg) translateY(6px)}
.fan a:nth-child(2){width:42%;z-index:1;transform:none}
.fan a:nth-child(3){transform:rotate(7deg) translateY(6px)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);background:var(--bg2);margin-top:22px}
.stats div{padding:10px 4px 8px;text-align:center;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0}
.stats b{display:block;font-family:var(--en);font-weight:400;font-size:32px;line-height:1}
.stats span{font-size:11.5px;color:var(--sub)}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.quick a{display:block;background:var(--bg2);border:1px solid var(--line);padding:13px 14px 11px;text-decoration:none;color:var(--ink);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:background .15s}
.quick a:hover{background:var(--bg3)}
.quick b{display:block;font-family:var(--en);font-weight:400;font-size:24px;letter-spacing:.04em;line-height:1}
.quick span{font-size:12px;color:var(--sub)}
@media (max-width:560px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.packrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:520px}
.packrow a{text-decoration:none;color:var(--ink);text-align:center;font-size:12.5px;font-weight:700;line-height:1.35}
.packrow img{width:100%;margin-bottom:6px;filter:drop-shadow(0 6px 10px rgba(30,28,60,.18))}

/* カードのページ */
.uhead{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:28px;align-items:end;margin-top:8px}
.uhead .motif{font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:.16em;color:var(--uc);margin:0;display:flex;gap:8px;align-items:center}
.uhead h1{font-weight:900;font-size:clamp(30px,6vw,52px);line-height:1.15;margin:2px 0 12px}
.info{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);background:var(--bg2)}
.info div{padding:8px 6px;text-align:center;border-left:1px solid var(--line)}
.info div:first-child{border-left:0}
.info span{display:block;font-size:11px;color:var(--sub);line-height:1.4}
.info b{font-weight:900;font-size:16px;line-height:1.5}
.info b.en{font-family:var(--en);font-weight:400;font-size:24px;line-height:1.1}
@media (max-width:700px){.uhead{grid-template-columns:minmax(0,1fr);gap:18px}.uhead > .face{width:min(64%,250px);margin:0 auto}}
.mv > div{padding:12px 16px;border-bottom:1px solid var(--line)}
.mv > div:last-child{border-bottom:0}
.mv .h{display:flex;align-items:center;gap:8px;font-weight:900;line-height:1.4}
.mv .h em{margin-left:auto;font-style:normal;font-family:var(--en);font-weight:400;font-size:24px;line-height:1;padding-left:8px}
.mv p{margin:4px 0 0;color:var(--ink2);font-size:14px}
.orbs{display:flex;gap:3px;flex:none}
.orb{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:900;line-height:1;color:#fff;background:var(--oc)}
.link{display:flex;align-items:center;gap:12px;padding:10px 14px;text-decoration:none;color:var(--ink);font-weight:700}
.link .face{width:42px;flex:none}
.link small{display:block;font-weight:500;color:var(--sub);font-size:12px}
.link::after{content:"›";margin-left:auto;font-family:var(--en);font-size:24px;color:var(--sub)}
.link:hover{background:var(--bg)}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:36px}
.pn a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);background:var(--bg2);border:1px solid var(--line);padding:9px 12px;min-width:0;font-weight:700;font-size:13.5px}
.pn a:hover{border-color:var(--line2)}
.pn a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn i{font-style:normal;font-family:var(--en);font-size:20px;color:var(--sub);line-height:1}

/* ティアリスト */
.tier{margin-top:14px}
.tier .hd{display:flex;align-items:center;gap:10px;padding:0 14px 0 0;border-bottom:1px solid var(--line)}
.tier .hd b{width:44px;height:44px;display:grid;place-items:center;font-family:var(--en);font-weight:400;font-size:30px;line-height:1;color:#fff;background:var(--rk);padding-top:3px}
.tier .hd span{font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.16em;color:var(--sub)}
.tier .row{display:grid;grid-template-columns:54px minmax(0,1fr);gap:14px;align-items:center;padding:10px 14px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.tier .row:last-child{border-bottom:0}
.tier .row:hover{background:var(--bg)}
.tier .row b{font-weight:900;display:block;line-height:1.4}
.tier .row p{margin:2px 0 0;color:var(--ink2);font-size:13.5px;line-height:1.6}

/* デッキ */
.deck{margin-top:16px}
.deck .hd{padding:14px 16px 12px;border-bottom:1px solid var(--line);border-top:3px solid var(--uc)}
.deck .hd .k{font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--uc)}
.deck .hd h3{font-weight:900;font-size:19px;margin:0;line-height:1.4}
.deck .hd p{margin:4px 0 0;color:var(--ink2);font-size:14px}
.deck .bd{padding:18px 16px 16px}
.steps{counter-reset:t;margin:0;padding:0;list-style:none}
.steps li{counter-increment:t;display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);color:var(--ink2);font-size:14px}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(t,decimal-leading-zero);font-family:var(--en);font-size:20px;line-height:1.3;color:var(--accent)}
.steps b{display:block;color:var(--ink);font-weight:900;font-size:15px}

/* 弱点の図 */
.cycle{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:2px 0 12px}
.cycle .n{font-weight:900;font-size:14px;padding:5px 16px;color:#fff;background:var(--tc);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.cycle .a{font-family:var(--en);font-size:22px;color:var(--sub);line-height:1}

/* パック */
.pk{margin-top:14px}
.pk .hd{display:grid;grid-template-columns:78px minmax(0,1fr);gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.pk .hd img{filter:drop-shadow(0 4px 8px rgba(30,28,60,.2))}
.pk .hd h3{font-weight:900;font-size:19px;margin:0 0 4px;line-height:1.3}
.pk .bd{padding:16px}

footer{border-top:1px solid var(--line);background:var(--bg2);color:var(--sub);font-size:12px;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px))}
footer .wrap{display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap}
</style>
</head>
<body>
<header id="hd">
  <div class="wrap">
    <a class="brand" href="#/">MEGAPOKE<b>WIKI</b></a>
    <div class="search"><input type="search" id="q" placeholder="カードをさがす" autocomplete="off" aria-label="カードをさがす"><div class="results" id="res" hidden></div></div>
    <nav id="nav">
      <a href="#/cards" data-r="cards">カード</a>
      <a href="#/tier" data-r="tier">ティアリスト</a>
      <a href="#/decks" data-r="decks">デッキ</a>
      <a href="#/basics" data-r="basics">遊びかた</a>
      <a href="#/rules" data-r="rules">ルール</a>
      <a href="#/packs" data-r="packs">パック</a>
      <a href="#/faq" data-r="faq">Q&amp;A</a>
      <a href="megapoke.html" class="play">ゲームをプレイ</a>
    </nav>
    <button class="menu-btn" id="mb" aria-label="メニュー"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap"><span>メガポケ 公式Wiki</span><span>© 女神鯖</span></div></footer>

<script>
const TYPE_EN = { '格闘':'FIGHTING', '悪':'DARK', '超':'PSYCHIC', '無色':'COLORLESS' };
const KIND_LABEL = { item:'グッズ', support:'サポート', tool:'どうぐ' };
const KIND_EN = { item:'ITEM', support:'SUPPORTER', tool:'TOOL' };
const STATUS_LABEL = { poison:'どく', burn:'やけど', paralysis:'まひ', sleep:'ねむり', confusion:'こんらん' };
const TIMING_LABEL = { onPlay:'場に出たとき', passive:'常時', activated:'自分の番に1回' };
const RARITY_ORDER = ['diamond1','diamond2','diamond3','diamond4','star1','star2','star3','spade','club','crown','dopa','promo'];
const TYPES = ['格闘','悪','超','無色'];

/* ---- ティアリスト(手書き)。カードIDで指定。ここに無いカードはティアリストに出ない ---- */
const TIERS = [
  { t:'S', id:'roy_kaika',    why:'ベンチ全体へのダメージと、毎ターンの回復を両立します。' },
  { t:'S', id:'mitsu_ex',     why:'残りHPが80以下で130ダメージ。きぜつさせるたびにHPを30回復します。' },
  { t:'S', id:'pom_ex',       why:'たねでHP140。どくの付与と、ぽむのスイカによる全体回復ができます。' },
  { t:'A', id:'ikoma_ex',     why:'たねのex。ワザで相手のエネルギーをトラッシュします。' },
  { t:'A', id:'kagame_base',  why:'状態異常になりません。同じワザを続けて使うと70ダメージです。' },
  { t:'A', id:'promo_launch', why:'コインを4回投げ、3回オモテなら相手をきぜつさせます。' },
  { t:'B', id:'bird_base',    why:'バトル場に出たとき、コインで相手をこんらんにします。' },
  { t:'B', id:'family_rabbit',why:'場のイッカウサギの数だけコインを投げます。全パック共通です。' },
  { t:'B', id:'villager',     why:'受けるダメージを20減らします。いこまexがいると、にげるコストが0になります。' },
  { t:'C', id:'roy_base',     why:'ろいexの怪化前。ベンチにエネルギーをつけられます。' },
  { t:'C', id:'mitsu_base',   why:'みーつEXの怪化前です。' },
];

/* ---- デッキレシピ(手書き) ---- */
const DECKS = [
  { name:'みーつEX 悪ビートダウン', type:'悪', energy:['悪'],
    lead:'HPの高い悪タイプを並べ、グッズの回復で場を維持します。',
    cards:[['mitsu_base',2],['mitsu_ex',2],['pom_ex',2],['kagame_base',2],['bird_base',1],['item_watermelon',2],['item_akamaru',2],['item_ball',2]],
    how:['ばーど・かがめをバトル場に出し、ベンチのみーつにエネルギーをつけます。','みーつEXに怪化し、残りHP80以下での130ダメージを狙います。','ぽむEXが場にいるときに「ぽむのスイカ」を使い、全員を回復します。'] },
  { name:'ろいex 超コントロール', type:'超', energy:['超'],
    lead:'ベンチへのダメージとエネルギーのトラッシュで、相手の展開を妨げます。',
    cards:[['roy_base',2],['roy_kaika',2],['ikoma_ex',2],['villager',2],['family_rabbit',2],['tool_gtx',1],['item_ball',2]],
    how:['ろいの「プロデュース」で、ベンチに超エネルギーをつけます。','ろいexの「まかない」で、相手のベンチにもダメージを与えます。','いこまexで相手のエネルギーをトラッシュします。'] },
];

let D = null, CARD_LIST = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ゲーム本体からデータ定義の部分だけ切り出して読む(カードを追加すると自動で反映される)
function slice(src, start, end){
  const a = src.indexOf(start); if(a < 0) throw new Error('not found: ' + start);
  const b = src.indexOf(end, a); if(b < 0) throw new Error('not found: ' + end);
  return src.slice(a, b + (end.startsWith('\n') ? end.length : 0));
}
async function loadData(){
  const src = await (await fetch('megapoke.html', { cache:'no-cache' })).text();
  return new Function([
    slice(src, 'const CARDS = {', 'const ALL_PRINT_IDS'),
    slice(src, 'const RARITY_LABEL = {', '\n};'),
    slice(src, 'const RARITY_NAME = {', '\n};'),
    slice(src, 'const PACKS = {', '\n};'),
    slice(src, 'const SLOT_RARITY_WEIGHTS = {', '\n};'),
    'return { CARDS, PRINTS, WEAKNESS, PACKS, SLOT_RARITY_WEIGHTS, RARITY_LABEL, RARITY_NAME };'
  ].join('\n'))();
}

/* ---- データの小道具 ---- */
const C = id => D.CARDS[id];
const printsOf = id => Object.values(D.PRINTS).filter(p => p.cardId === id).sort((a,b) => RARITY_ORDER.indexOf(a.rarity) - RARITY_ORDER.indexOf(b.rarity));
const artOf = p => p && (p.image || C(p.cardId).image) || null;
const bestArt = id => { const ps = printsOf(id); return artOf([...ps].reverse().find(artOf)); };
const firstArt = id => artOf(printsOf(id).find(artOf));
// 一覧では軽い画像(thumbs/*.webp、tools/make_thumbs.py で作る)を使う。無ければ元の画像を出す
const thumb = u => /^https:\/\/[a-z0-9]+\.supabase\.co\//.test(u || '') ? 'thumbs/' + decodeURIComponent(u.split('/').pop()).replace(/\.[a-z]+$/i, '').replace(/[^A-Za-z0-9_-]/g, '_') + '.webp' : u;
const imgTag = (u, alt, full) => u ? `<img loading="lazy" src="${esc(full ? u : thumb(u))}" data-full="${esc(u)}" alt="${esc(alt)}" onerror="if(this.dataset.full&&this.src!==this.dataset.full){this.src=this.dataset.full;this.dataset.full=''}else this.remove()">` : '';
const tc = c => c.kind === 'creature' ? `var(--t-${c.type})` : 'var(--t-tr)';
const kindJa = c => c.kind === 'creature' ? `${c.type}・${c.basic ? 'たね' : '怪化'}` : KIND_LABEL[c.kind];
const roleLabel = c => c.kind === 'creature' ? TYPE_EN[c.type] + (c.isEx ? ' · EX' : '') : KIND_EN[c.kind];
const rarityCell = r => `${esc(D.RARITY_LABEL[r] || '')}<small>${esc(D.RARITY_NAME[r] || '')}</small>`;
function packsOfPrint(p){
  const c = C(p.cardId);
  if(!artOf(p) || p.rarity === 'promo') return [];
  return Object.values(D.PACKS).filter(pk => p.packId ? p.packId === pk.id : (c.kind !== 'creature' || c.type === pk.type || c.type === '無色')).map(pk => pk.id);
}
const weaknessOf = type => Object.keys(D.WEAKNESS).find(k => D.WEAKNESS[k] === type) || null;
function attackDesc(atk, card){
  if(atk.desc) return atk.desc;
  const parts = [], c = atk.coin;
  if(c){
    if(c.countMode === 'boardCount') parts.push(`自分の場の「${card.name}」の数ぶんコインを投げ、オモテの数×${c.amount}ダメージ。`);
    else if(c.type === 'perHeads') parts.push(`コインを${c.count}回投げ、オモテの数×${c.amount}ダメージ。`);
    else if(c.type === 'bonus') parts.push(`コインを${c.count||1}回投げオモテなら、${c.amount}ダメージ追加。`);
  }
  if(atk.attackEffect === 'attachBenchEnergy') parts.push(`エネルギーゾーンから${atk.energyType||''}エネルギーを1個出し、ベンチのメガモンにつける。`);
  if(atk.inflicts) parts.push(`相手のバトルメガモンを${STATUS_LABEL[atk.inflicts]||atk.inflicts}にする。`);
  return parts.join('');
}
function dmgText(atk){
  if(!atk.dmg) return atk.coin && atk.coin.type === 'perHeads' ? `${atk.coin.amount}×` : '';
  return atk.dmg + ((atk.coin && atk.coin.type === 'bonus') || atk.repeatBonus || atk.bonusIfSelfHpBelow ? '+' : '');
}

  },
};

/* ---- 画面の切り替え(#/cards など) ---- */
function route(){
  const [r, arg] = location.hash.replace(/^#\/?/, '').split('/');
  $('#hd').classList.remove('open');
  document.querySelectorAll('#nav a[data-r]').forEach(a => a.classList.toggle('on', a.dataset.r === r || (r === 'card' && a.dataset.r === 'cards')));
  if(!D) return;
  (PAGES[r] || PAGES[''])(decodeURIComponent(arg || ''));
  const el = r === 'rules' && arg === 'status' && document.getElementById('status');
  window.scrollTo(0, el ? el.getBoundingClientRect().top + scrollY - 110 : 0);
}
window.addEventListener('hashchange', route);
$('#mb').onclick = () => $('#hd').classList.toggle('open');

/* ---- 検索 ---- */
$('#q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase(), res = $('#res');
  if(!q || !D){ res.hidden = true; return; }
  const hits = CARD_LIST.filter(c => [c.name, c.desc, c.type, c.ability && c.ability.name, ...(c.attacks||[]).map(a => a.name)].join(' ').toLowerCase().includes(q)).slice(0, 10)
    .map(c => { const a = firstArt(c.id); return `<a href="#/card/${esc(c.id)}">${a ? `<img src="${esc(thumb(a))}" alt="" onerror="this.replaceWith(document.createElement('i'))">` : '<i></i>'}${esc(c.name)}<small>${esc(kindJa(c))}</small></a>`; });
  res.innerHTML = hits.join('') || '<a>該当するカードはありません</a>';
  res.hidden = false;
});
$('#res').addEventListener('click', () => { $('#res').hidden = true; $('#q').value = ''; $('#q').blur(); });
document.addEventListener('click', e => { if(!e.target.closest('.search')) $('#res').hidden = true; });

(async () => {
  try{ D = await loadData(); }
  catch(err){ console.error(err); $('#app').innerHTML = '<p class="empty" style="padding-top:40px">カードデータを読み込めませんでした。ページを再読み込みしてください。</p>'; return; }
  // Wikiに載せるのは絵のあるカードだけ(絵の無い試作カードは載せない)。並びはメガモン(タイプ順)→トレーナーズ
  CARD_LIST = Object.values(D.CARDS).filter(c => printsOf(c.id).some(artOf))
    .sort((a,b) => (a.kind === 'creature' ? 0 : 1) - (b.kind === 'creature' ? 0 : 1) || TYPES.indexOf(a.type) - TYPES.indexOf(b.type));
  route();
})();
</script>
