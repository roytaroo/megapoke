<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>メガポケ 公式Wiki</title>
<meta name="description" content="メガポケ(MEGAMI Trading Card Game Pocket)の公式Wiki。カード図鑑・最強ランキング・おすすめデッキ・遊び方・ルール">
<meta name="theme-color" content="#07080c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* BOWFLIT 公式Wikiと同じ見た目(ほぼ黒・紫の差し色・斜めに切った角) */
:root{
  --bg:#07080c; --bg2:#0e1018; --bg3:#151826; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.18);
  --ink:#eeedf5; --sub:#8d91a6; --accent:#a24bff; --accent2:#c58bff; --good:#5fe08a; --bad:#ff5a6a; --gold:#ffc446;
  --en:"Bebas Neue","Zen Kaku Gothic New",sans-serif; --ui:"Rajdhani","Zen Kaku Gothic New",sans-serif; --jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --t-格闘:#ff8a3c; --t-悪:#8a7cff; --t-超:#ff5cc8; --t-無色:#9aa4b4; --t-tr:#54d6ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--jp);font-weight:500;font-size:15.5px;line-height:1.85;-webkit-font-smoothing:antialiased}
a{color:var(--accent2)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
/* 上のバー */
header{position:sticky;top:0;z-index:30;background:rgba(7,8,12,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;gap:18px;height:60px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);flex:none}
.brand .logo{font-family:var(--en);font-size:22px;letter-spacing:.06em;line-height:1;color:#fff}
.brand b{font-family:var(--en);font-weight:400;font-size:22px;letter-spacing:.08em;color:var(--accent2);line-height:1}
header nav{display:flex;gap:22px;margin-left:auto}
header nav a{font-family:var(--ui);font-weight:700;font-size:14px;letter-spacing:.12em;color:var(--sub);text-decoration:none;text-transform:uppercase}
header nav a:hover,header nav a.on{color:#fff}
.search{position:relative;flex:none}
.search input{width:180px;font:inherit;font-size:14px;color:var(--ink);background:var(--bg3);border:1px solid var(--line2);border-radius:0;padding:6px 10px;-webkit-appearance:none}
.menu-btn{display:none;width:40px;height:40px;border:1px solid var(--line2);background:transparent;color:#fff;cursor:pointer;flex:none;padding:0}
.menu-btn svg{width:20px;height:20px;display:block;margin:auto}
@media (max-width:1240px){
  header nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;gap:0;background:#07080c;border-bottom:1px solid var(--line);padding:6px 18px 12px;margin:0}
  header.open nav{display:flex}
  header nav a{padding:12px 0;border-bottom:1px solid var(--line)}
  .menu-btn{display:block;margin-left:auto}
  .search input{width:130px}
}
@media (max-width:420px){.brand .logo{display:none}.search input{width:110px}}
.results{position:absolute;right:0;top:calc(100% + 4px);width:min(320px,80vw);background:var(--bg2);border:1px solid var(--line2);z-index:40;max-height:60vh;overflow:auto}
.results a{display:flex;gap:10px;align-items:center;padding:8px 12px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);font-size:14px}
.results a:hover{background:var(--bg3)}
.results img,.results i{width:24px;height:34px;object-fit:cover;flex:none;background:var(--bg3)}
.results small{color:var(--sub);margin-left:auto;white-space:nowrap}
/* 共通 */
main{min-height:70vh;padding-bottom:80px}
.crumb{font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--sub);margin:22px 0 8px}
.crumb a{color:var(--sub);text-decoration:none}.crumb a:hover{color:#fff}
h1.t{font-family:var(--en);font-weight:400;font-size:clamp(48px,8vw,96px);line-height:.9;margin:0 0 8px;letter-spacing:.02em}
h1.t i{font-style:normal;color:var(--accent)}
.lead{color:var(--sub);max-width:46em;margin:0 0 30px}
h2.s{font-weight:900;font-size:20px;margin:44px 0 14px;display:flex;align-items:center;gap:12px}
h2.s::before{content:"";width:10px;height:10px;background:var(--accent);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);flex:none}
h2.s small{font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.18em;color:var(--sub);text-transform:uppercase}
.card{background:var(--bg2);border:1px solid var(--line);padding:18px 20px}
.card p:first-child{margin-top:0}.card p:last-child{margin-bottom:0}
.card ul,.card ol{margin:0;padding-left:1.3em}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.tabs button{font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:.1em;border:1px solid var(--line2);background:transparent;color:var(--sub);padding:6px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button[style]{color:var(--tc)}
.tabs button[style][aria-pressed="true"]{background:var(--tc);border-color:var(--tc);color:#07080c}
.note{border-left:3px solid var(--gold);padding:4px 0 4px 16px;color:#d6d8e4;margin:0 0 18px}
.gold{color:var(--gold);font-weight:900}
/* ホーム */
.home-hero{position:relative;padding:40px 0 10px}
.story{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center}
.story p{margin:0 0 12px;color:#c9cbd8}
.story .cast{display:flex;justify-content:center;align-items:flex-end;padding:10px 0;width:100%}
.story .cast .cf{width:34%;margin:0 -4%;transform:rotate(-8deg);box-shadow:0 10px 24px rgba(0,0,0,.6)}
.story .cast .cf:nth-child(2){width:40%;z-index:1;transform:translateY(-8px)}
.story .cast .cf:nth-child(3){transform:rotate(8deg)}
@media (max-width:760px){.story{grid-template-columns:minmax(0,1fr)}.story .cast{order:-1;max-width:360px;margin:0 auto}}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:30px}
.quick a{display:block;background:var(--bg2);border:1px solid var(--line);padding:16px 18px;text-decoration:none;color:var(--ink);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.quick a:hover{border-color:var(--accent);background:var(--bg3)}
.quick b{display:block;font-family:var(--en);font-weight:400;font-size:28px;letter-spacing:.04em;line-height:1}
.quick span{font-size:13px;color:var(--sub)}
@media (max-width:760px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:22px 0}
.stats div{background:var(--bg2);border:1px solid var(--line);padding:12px 14px;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.stats b{display:block;font-family:var(--en);font-weight:400;font-size:40px;line-height:1;color:var(--ink)}
.stats span{font-size:12.5px;color:var(--sub)}
/* カード一覧 */
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
@media (max-width:420px){.ugrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ucard{position:relative;display:block;background:var(--bg2);border:1px solid var(--line);text-decoration:none;color:var(--ink);overflow:hidden;transition:border-color .15s,transform .15s}
.ucard:hover{border-color:var(--uc);transform:translateY(-2px)}
.ucard .pic{padding:12px 14px 10px;background:radial-gradient(70% 60% at 50% 60%,color-mix(in srgb,var(--uc) 35%,transparent),transparent 72%);border-bottom:3px solid var(--uc)}
.ucard .nm{padding:8px 12px 10px}
.ucard b{font-weight:900;font-size:15px;line-height:1.3;display:block}
.ucard span{font-size:12px;color:var(--sub)}
.ucard .role{display:block;font-family:var(--ui);font-weight:700;font-size:10.5px;letter-spacing:.16em;line-height:1.2;margin-bottom:2px;color:var(--uc)}
.ucard .tier{position:absolute;top:8px;right:8px;z-index:2;font-family:var(--en);font-size:22px;line-height:1;padding:3px 7px 1px;background:var(--bg);color:var(--rk);border:1px solid var(--rk)}
.ucard .cnt{position:absolute;top:8px;left:8px;z-index:2;font-family:var(--en);font-size:20px;line-height:1;padding:3px 7px 1px;background:var(--accent);color:#fff}
/* カードの絵 */
.face{aspect-ratio:745/1040;position:relative;overflow:hidden;border-radius:6px;background:var(--bg3)}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1}
.gen{position:absolute;inset:0;display:flex;flex-direction:column;padding:8px 7px;color:#fff;font-size:10px;line-height:1.35;background:linear-gradient(160deg,color-mix(in srgb,var(--uc) 70%,#fff),color-mix(in srgb,var(--uc) 70%,#000))}
.gen .row{display:flex;gap:4px;align-items:baseline}.gen .row b{font-size:11.5px;font-weight:900}.gen .row em{margin-left:auto;font-style:normal;font-family:var(--en);font-size:14px}
.gen .art{flex:1;margin:5px 0;background:rgba(255,255,255,.18);display:grid;place-items:center;font-family:var(--en);font-size:22px;letter-spacing:.04em}
/* カードのページ */
.uhead{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:32px;align-items:end;margin-top:6px}
.uhead .pic{padding:18px;background:radial-gradient(60% 55% at 50% 60%,color-mix(in srgb,var(--uc) 40%,transparent),transparent 72%);border-bottom:3px solid var(--uc)}
.uhead .motif{font-family:var(--ui);font-weight:700;letter-spacing:.16em;color:var(--uc);margin:0}
.uhead h1{font-weight:900;font-size:clamp(36px,7vw,64px);line-height:1.05;margin:4px 0 10px;letter-spacing:.01em}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.meta div{background:var(--bg2);border:1px solid var(--line);padding:6px 14px}
.meta span{display:block;font-family:var(--ui);font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--sub)}
.meta b{font-family:var(--en);font-weight:400;font-size:24px;letter-spacing:.04em;line-height:1.1}
.stars{color:var(--gold);letter-spacing:.1em}
.ability{border-left:3px solid var(--uc);padding:4px 0 4px 16px;color:#d6d8e4;margin:0}
@media (max-width:760px){.uhead{grid-template-columns:minmax(0,1fr)}.uhead .pic{max-width:260px;margin:0 auto;width:100%}}
.rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:10px}
.rel > div,.rel > a{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;background:var(--bg2);border:1px solid var(--line);padding:14px 16px;text-decoration:none;color:var(--ink)}
.rel a:hover{border-color:var(--line2);background:var(--bg3)}
.rel b{font-weight:900}
.rel em{font-style:normal;font-family:var(--en);font-size:24px;letter-spacing:.04em;color:var(--accent2);margin-left:8px;line-height:1}
.rel p{margin:2px 0 0;color:var(--sub);font-size:14.5px}
.rel .k{font-family:var(--ui);font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--uc,var(--accent2))}
.orbs{display:flex;gap:3px;padding-top:3px}
.orb{width:22px;height:22px;display:grid;place-items:center;font-size:11px;font-weight:900;line-height:1;color:#07080c;background:var(--oc);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.tips{counter-reset:t;display:grid;gap:8px;margin:0;padding:0;list-style:none}
.tips li{counter-increment:t;display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;background:var(--bg2);border:1px solid var(--line);padding:12px 16px}
.tips li::before{content:counter(t,decimal-leading-zero);font-family:var(--en);font-size:26px;line-height:1.1;color:var(--uc,var(--accent2))}
.tips b{display:block;font-weight:900}
.tips p{margin:2px 0 0;color:var(--sub);font-size:14.5px}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:40px}
.pn a{display:flex;overflow:hidden;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--bg2);border:1px solid var(--line);padding:10px 14px;min-width:0;font-weight:700;font-size:14px}
.pn a:hover{border-color:var(--line2)}
.pn span{font-family:var(--en);font-size:22px;letter-spacing:.04em;color:var(--sub)}
/* 表 */
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th,.tbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--sub);text-transform:uppercase;white-space:nowrap}
.tbl td.num{font-family:var(--en);font-size:20px;letter-spacing:.04em;white-space:nowrap}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--bg2)}
.rar{font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.08em;padding:1px 8px;border:1px solid currentColor;white-space:nowrap}
.tp{font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.1em;padding:1px 8px;border:1px solid var(--tc);color:var(--tc);white-space:nowrap}
.basic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.basic-grid .card b{display:block;font-weight:900;margin-bottom:4px}
.basic-grid .card .k{font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.16em;color:var(--accent2)}
.basic-grid .card p{margin:0;color:var(--sub);font-size:14.5px}
.empty{color:var(--sub)}
/* ランキング */
.tierrow{display:grid;grid-template-columns:64px minmax(0,1fr);border:1px solid var(--line);background:var(--bg2);margin-bottom:10px}
.tierrow .lb{display:grid;place-items:center;font-family:var(--en);font-size:44px;line-height:1;color:#07080c;background:var(--rk)}
.tierrow .cs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;padding:12px}
.tierrow .cs a{text-decoration:none;color:var(--ink);font-size:12px;font-weight:700;text-align:center;line-height:1.3}
.tierrow .cs a .face{margin-bottom:5px}
/* デッキ */
.deck{border:1px solid var(--line);background:var(--bg2);margin-bottom:22px}
.deck .dh{padding:16px 18px;border-bottom:3px solid var(--uc);background:linear-gradient(110deg,color-mix(in srgb,var(--uc) 22%,transparent),transparent 70%)}
.deck .dh .k{font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.16em;color:var(--uc)}
.deck .dh h3{font-weight:900;font-size:22px;margin:2px 0 0;line-height:1.3}
.deck .db{padding:16px 18px}
.deck .db > p{margin:0 0 14px;color:#c9cbd8}
.deck .ugrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.deck .ucard .pic{padding:8px 9px 7px}.deck .ucard .nm{padding:5px 8px 7px}.deck .ucard b{font-size:12.5px}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;align-items:center;margin:16px 0}
.bars span{font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--sub)}
.bars i{display:block;height:6px;background:var(--bg3);position:relative}
.bars i::after{content:"";position:absolute;inset:0;width:var(--v);background:var(--uc)}
/* 弱点の図 */
.cycle{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.cycle .n{font-weight:900;padding:8px 16px;border:1px solid var(--tc);color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.cycle .a{font-family:var(--en);font-size:22px;color:var(--sub)}
/* 盤面図 */
.board{display:grid;gap:6px;text-align:center;font-size:13px;font-weight:700}
.board div{border:1px solid var(--line2);padding:8px;background:var(--bg3);color:#c9cbd8}
.board .o{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 7%,var(--bg2))}
.board .m{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--bg2))}
.board .y{border-color:color-mix(in srgb,var(--accent) 60%,transparent);background:color-mix(in srgb,var(--accent) 9%,var(--bg2))}
.board small{display:block;color:var(--sub);font-weight:500;font-size:12px}
footer{border-top:1px solid var(--line);color:var(--sub);font-size:12.5px;padding-block:22px calc(22px + env(safe-area-inset-bottom,0px))}
footer .wrap{display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap}
</style>
</head>
<body>
<header id="hd">
  <div class="wrap">
    <a class="brand" href="#/"><span class="logo">MEGAPOKE</span><b>WIKI</b></a>
    <div class="search"><input type="search" id="q" placeholder="さがす" autocomplete="off" aria-label="Wikiの中をさがす"><div class="results" id="res" hidden></div></div>
    <nav id="nav">
      <a href="#/cards" data-r="cards">Cards</a>
      <a href="#/tier" data-r="tier">ランキング</a>
      <a href="#/decks" data-r="decks">デッキ</a>
      <a href="#/basics" data-r="basics">遊び方</a>
      <a href="#/rules" data-r="rules">ルール</a>
      <a href="#/packs" data-r="packs">パック</a>
      <a href="#/faq" data-r="faq">Q&amp;A</a>
      <a href="megapoke.html">ゲームへ</a>
    </nav>
    <button class="menu-btn" id="mb" aria-label="メニュー"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
</header>
<main><div class="wrap" id="app"><p class="empty" style="padding-top:40px">読み込み中…</p></div></main>
<footer><div class="wrap"><span>メガポケ 公式Wiki · カードはゲームとあわせて自動で更新されます</span><span>女神鯖</span></div></footer>

<script>
const TYPE_EN = { '格闘':'FIGHTING', '悪':'DARK', '超':'PSYCHIC', '無色':'COLORLESS' };
const KIND_LABEL = { item:'グッズ', support:'サポート', tool:'どうぐ' };
const KIND_EN = { item:'ITEM', support:'SUPPORTER', tool:'TOOL' };
const STATUS_LABEL = { poison:'どく', burn:'やけど', paralysis:'まひ', sleep:'ねむり', confusion:'こんらん' };
const TIMING_LABEL = { onPlay:'場に出た時', passive:'常時', activated:'ターン1回' };
const RARITY_ORDER = ['diamond1','diamond2','diamond3','diamond4','star1','star2','star3','spade','club','crown','dopa','promo'];
const TYPES = ['格闘','悪','超','無色'];
const RANK_COLOR = { S:'#ff5a6a', A:'#ffc446', B:'#5fe08a', C:'#8d91a6' };

/* ---- wiki編集部の評価(手書き)。カードIDで書く。載ってないカードはランキングに出ない ---- */
const TIERS = [
  { t:'S', id:'roy_kaika',  stars:5, why:'HP140に、ベンチ全員へ10ダメージの「まかない」。毎ターン味方を10回復できる特性まで付いた万能アタッカー。' },
  { t:'S', id:'mitsu_ex',   stars:5, why:'100ダメージ、HP80以下なら130。倒すたびに30回復するので、ピンチになるほど強い。悪デッキの切り札。' },
  { t:'S', id:'pom_ex',     stars:5, why:'たねなのにHP140のex。80ダメージ+どく。「ぽむのスイカ」と組むと全体回復までこなす。' },

function slice(src, start, end){
  const a = src.indexOf(start); if(a < 0) throw new Error('not found: ' + start);
  const b = src.indexOf(end, a); if(b < 0) throw new Error('not found: ' + end);
  return src.slice(a, b + (end.startsWith('\n') ? end.length : 0));
}
async function loadData(){
  const src = await (await fetch('megapoke.html', { cache:'no-cache' })).text();
  return new Function([
    slice(src, 'const CARDS = {', 'const ALL_PRINT_IDS'),
    slice(src, 'const RARITY_LABEL = {', '\n};'),
    slice(src, 'const RARITY_NAME = {', '\n};'),
    slice(src, 'const PACKS = {', '\n};'),
    slice(src, 'const SLOT_RARITY_WEIGHTS = {', '\n};'),
    'return { CARDS, PRINTS, WEAKNESS, PACKS, SLOT_RARITY_WEIGHTS, RARITY_LABEL, RARITY_NAME };'
  ].join('\n'))();
}

  const c = C(p.cardId);
  if(!artOf(p)) return [];
  return Object.values(D.PACKS).filter(pk => p.packId ? p.packId === pk.id : (c.kind !== 'creature' || c.type === pk.type || c.type === '無色')).map(pk => pk.id);
}

function attackDesc(atk, card){
  if(atk.desc) return atk.desc;
  const parts = [], c = atk.coin;
  if(c){
    if(c.countMode === 'boardCount') parts.push(`自分の場の「${card.name}」の数ぶんコインを投げ、オモテの数×${c.amount}ダメージ。`);
    else if(c.type === 'perHeads') parts.push(`コインを${c.count}回投げ、オモテの数×${c.amount}ダメージ。`);
    else if(c.type === 'bonus') parts.push(`コインを${c.count||1}回投げオモテなら、${c.amount}ダメージ追加。`);
  }
  if(atk.attackEffect === 'attachBenchEnergy') parts.push(`エネルギーゾーンから${atk.energyType||''}エネルギーを1個出し、ベンチのメガモンにつける。`);
  if(atk.inflicts) parts.push(`相手のバトルメガモンを${STATUS_LABEL[atk.inflicts]||atk.inflicts}にする。`);
  return parts.join('') || 'ダメージを与える。';
}
function dmgText(atk){
  if(!atk.dmg) return atk.coin && atk.coin.type === 'perHeads' ? `${atk.coin.amount}×` : '';

}

        <div class="y">自分のバトル場<small>タップでワザ・特性</small></div><div class="y">自分のベンチ<small>タップでにげる</small></div><div class="y">山札 + 手札<small>上スワイプで出す・長押しで拡大</small></div></div></div>
      ${head2('操作','Controls')}<div class="tbl-wrap"><table class="tbl"><tr><th>やりたいこと</th><th>操作</th></tr>
        <tr><td>ワザ・特性</td><td>自分のバトル場をタップ → シートから選ぶ</td></tr><tr><td>エネルギー</td><td>光る玉をタップ → 付けたいメガモン</td></tr>
        <tr><td>にげる</td><td>ベンチのメガモンをタップ</td></tr><tr><td>カードを出す</td><td>手札を上にスワイプ</td></tr>
        <tr><td>カードを見る</td><td>手札を長押し</td></tr><tr><td>対象を選ぶ</td><td>金色に光っている場所をタップ</td></tr></table></div>
      ${head2('勝つためのコツ','Tips')}<ol class="tips">
        <li><div><b>ベンチにもエネルギーを貯める</b><p>バトル場がやられても、次のメガモンがすぐ攻撃できる。</p></div></li>
        <li><div><b>弱点を狙う</b><p>格闘→悪→超→格闘。弱点を突くと+20ダメージ。</p></div></li>
        <li><div><b>exは慎重に</b><p>強いけど、倒されると相手に2ポイント入る。</p></div></li>
        <li><div><b>次のエネルギーを見る</b><p>玉の横の予告を見て、付け先を先に決めておく。</p></div></li></ol>`);
  },
  rules: () => {
    set('ルール', `${crumb('RULES')}${T1('<i>Rules</i>', 'タイプと弱点・エネルギー・怪化・ポイント・状態異常。')}
      ${head2('タイプと弱点','Types')}<div class="card"><div class="cycle">${['格闘','悪','超','格闘'].map((t,i) => `${i ? '<span class="a">›</span>' : ''}<span class="n" style="--tc:var(--t-${t})">${t}</span>`).join('')}</div>
        <p>矢印の向きに強い。弱点を突くとワザのダメージが<span class="gold">+20</span>。<span class="tp" style="--tc:var(--t-無色)">無色</span> は弱点なしで、弱点も突かない。</p></div>
      ${head2('エネルギー','Energy')}${grid4([
        ['AUTO','毎ターン1個','山札から引く必要はない。付けられるのは1ターン1個まで。'],
        ['TYPES','格闘・悪・超の3種類','デッキで選んだタイプ(1〜3種類)からランダムで出る。1種類にしぼると確実。'],
        ['COLORLESS','無色はどれでもOK','ワザのコストの「無」は、どの種類のエネルギーでも払える。'],
        ['WHERE','どこにでも付けられる','バトル場にもベンチにも付けられる。']])}
      ${head2('怪化','Evolution')}<div class="card"><ul><li>メガモンの進化。手札の怪化カードを、場の怪化前のメガモンに重ねる</li><li>出したばかりのメガモンは、次の自分の番から怪化できる</li><li>ダメージとエネルギーはそのまま引き継ぐ</li><li>怪化すると、まひ・ねむり・こんらんが治る(どく・やけどは残る)</li></ul></div>
      ${head2('ポイントと勝ち負け','Points')}<div class="tbl-wrap"><table class="tbl"><tr><th>倒した相手</th><th>ポイント</th></tr><tr><td>ふつうのメガモン</td><td class="num">1</td></tr><tr><td>exのメガモン</td><td class="num" style="color:var(--gold)">2</td></tr></table></div>
        <p class="lead" style="margin:12px 0 0">3ポイント先取で勝ち。バトル場がきぜつしたら、次に出すメガモンはベンチから自分で選ぶ。山札が無くなっても、引けないだけで負けにはならない。</p>
      ${head2('にげる','Retreat')}<div class="card"><p>バトル場とベンチを入れ替える。カードに書かれた数だけエネルギーをトラッシュ。1ターンに1回。にげるとこんらんが治る。まひ・ねむりの間はにげられない。</p></div>
      ${head2('状態異常','Status', 'status')}<div class="tbl-wrap"><table class="tbl"><tr><th>状態</th><th>効果</th><th>治り方</th></tr>
        <tr><td><span class="tp" style="--tc:#b07cff">どく</span></td><td>自分の番のはじめに10ダメージ</td><td>回復カード(万能薬など)</td></tr>
        <tr><td><span class="tp" style="--tc:#ff7a4a">やけど</span></td><td>自分の番のはじめに20ダメージ</td><td>そのあとコインでオモテなら治る</td></tr>
        <tr><td><span class="tp" style="--tc:#ffc446">まひ</span></td><td>その番はワザもにげるも使えない</td><td>1ターンで治る</td></tr>
        <tr><td><span class="tp" style="--tc:#54a8ff">ねむり</span></td><td>ワザもにげるも使えない</td><td>番のはじめにコインでオモテなら起きる</td></tr>
        <tr><td><span class="tp" style="--tc:#ff5cc8">こんらん</span></td><td>ワザの時にコイン。ウラだと失敗</td><td>にげる・怪化</td></tr></table></div>
      ${head2('カードの種類','Card types')}${grid4([
        ['BASIC','たね','そのまま場に出せるメガモン。'],['EVOLUTION','怪化','場のたねに重ねて出すメガモン。'],
        ['ITEM','グッズ','使い切り。1ターンに何枚でも使える。'],['SUPPORTER','サポート','強力なお助け。1ターンに1枚まで。'],
        ['TOOL','どうぐ','メガモンに付けて使う。1体に1枚。'],['ABILITY','特性','場に出た時(バトル場だけ)/常時/ターン1回の3タイプ。']])}`);
  },
  packs: () => {
    const w = D.SLOT_RARITY_WEIGHTS;
    const tiers = RARITY_ORDER.filter(t => (w[4]&&w[4][t]) || (w[5]&&w[5][t]));
    const pct = (s, t) => { const o = w[s]; if(!o || !o[t]) return '—'; const v = o[t] / Object.values(o).reduce((a,b) => a + b, 0) * 100; return (v >= 1 ? v.toFixed(1) : v.toFixed(3)) + '%'; };
    set('パック', `${crumb('PACKS')}${T1('<i>Packs</i>', '1パック5枚。初回は無料で3回、そのあとは1日1回。特典コードのボーナスパックは別枠。')}
      <p class="note">メガモンはパックと同じタイプが出る。無色と、指定の無いトレーナーズは全パック共通。</p>
      ${Object.values(D.PACKS).map(pk => {
        const own = [], common = [];
        allCards().forEach(c => { const ps = printsOf(c.id).filter(p => packsOfPrint(p).includes(pk.id)); if(!ps.length) return; ((!ps.some(p => p.packId) && (c.kind !== 'creature' || c.type === '無色')) ? common : own).push(c.id); });
        return `${head2(esc(pk.name), TYPE_EN[pk.type] + ' PACK')}<div class="story card" style="--uc:var(--t-${pk.type});border-left:3px solid var(--uc)"><div>
          <p><span class="tp" style="--tc:var(--t-${pk.type})">${esc(pk.type)}タイプ</span></p>
          <p>${own.length ? `このパックだけのカード:${esc(own.map(id => C(id).name).join('、'))}` : 'このパックのカードは準備中。'}</p>
          <p style="color:var(--sub);font-size:14px">全パック共通:${esc(common.map(id => C(id).name).join('、') || 'なし')}</p></div>
          <div class="cast"><img src="${esc(pk.image)}" alt="" loading="lazy" style="width:50%;max-width:180px;box-shadow:0 10px 24px rgba(0,0,0,.6)" onerror="this.remove()"></div></div>
          ${own.length ? `<div class="ugrid" style="margin-top:10px">${own.map(id => ucard(id)).join('')}</div>` : ''}`; }).join('')}
      ${head2('排出率','Drop rates')}<p class="lead" style="margin:0 0 12px">1〜3枚目は必ず ◇。4枚目と5枚目がレアのチャンス(パックに無いレアリティは除いて抽選)。配布でもらえる PROMO もある。</p>
      <div class="tbl-wrap"><table class="tbl"><tr><th>Rarity</th><th>名前</th><th>4枚目</th><th>5枚目</th></tr>${tiers.map(t => `<tr><td><span class="rar" style="color:var(--gold)">${esc(D.RARITY_LABEL[t])}</span></td><td>${esc(D.RARITY_NAME[t])}</td><td class="num">${pct(4,t)}</td><td class="num">${pct(5,t)}</td></tr>`).join('')}</table></div>`);
  },
  faq: () => {
    const qa = [['カードの絵が出ない・「？」になる','画像サーバーが一時的に止まっていることがある。少し待ってから開き直してみて。'],
      ['相手の動きが反映されない','数秒ごとに自動で同期してる。止まって見えたらページを読み込み直すと戻る。'],
      ['特典コードはどこで入れる?','「パック開封」の画面から。コードは女神鯖のお知らせをチェック。'],
      ['同じカードは何枚入れられる?','2枚まで。レアリティ違いも合わせて2枚。'],
      ['先攻は有利?','先攻は最初の番だけ山札を引けない。そのかわり先に動ける。']];
    const gl = [['メガモン','女神鯖のメンバーがモチーフのモンスター。'],['たね','そのまま場に出せるメガモン。'],['怪化(かいか)','メガモンの進化。たねの上に重ねて出す。'],['バトル場 / ベンチ','戦うのはバトル場の1体。ベンチは控え(3体まで)。'],['ex','強いメガモン。倒されると相手に2ポイント。'],['トラッシュ','使い終わったカードやエネルギーの捨て場。'],['トレーナーズ','グッズ・サポート・どうぐの総称。']];
    set('Q&A', `${crumb('Q&amp;A')}${T1('Q&amp;<i>A</i>', 'よくある質問と用語集。')}
      ${head2('よくある質問','FAQ')}<ol class="tips">${qa.map(([q,a]) => `<li><div><b>${esc(q)}</b><p>${esc(a)}</p></div></li>`).join('')}</ol>
      ${head2('用語集','Glossary')}<div class="basic-grid">${gl.map(([k,v]) => `<div class="card"><b>${esc(k)}</b><p>${esc(v)}</p></div>`).join('')}</div>`);
  },
};

/* ---- 画面の切り替え(#/cards など) ---- */
function route(){
  const h = location.hash.replace(/^#\/?/, '');
  const [r, arg] = h.split('/');
  $('#hd').classList.remove('open');
  document.querySelectorAll('#nav a[data-r]').forEach(a => a.classList.toggle('on', a.dataset.r === r || (r === 'card' && a.dataset.r === 'cards')));
  if(!D) return;
  (PAGES[r] || PAGES[''])(decodeURIComponent(arg || ''));
  if(r === 'rules' && arg === 'status'){ const el = document.getElementById('status'); if(el) window.scrollTo(0, el.getBoundingClientRect().top + scrollY - 80); }
  else window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
$('#mb').onclick = () => $('#hd').classList.toggle('open');

/* ---- 検索 ---- */
const SEARCH_PAGES = [['cards','カード図鑑'],['tier','最強ランキング'],['decks','おすすめデッキ'],['basics','遊び方'],['rules','ルール'],['rules/status','状態異常'],['packs','パック・排出率'],['faq','Q&A・用語集']];
$('#q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase(), res = $('#res');
  if(!q || !D){ res.hidden = true; return; }
  const hits = allCards().filter(c => [c.name, c.desc, c.type, c.ability && c.ability.name, c.ability && c.ability.desc, ...(c.attacks||[]).map(a => a.name + (a.desc||''))].join(' ').toLowerCase().includes(q)).slice(0, 12)
    .map(c => { const a = firstArt(c.id); return `<a href="#/card/${esc(c.id)}">${a ? `<img src="${esc(a)}" alt="" onerror="this.replaceWith(document.createElement('i'))">` : '<i></i>'}${esc(c.name)}<small>${esc(typeLabel(c))}</small></a>`; });
  SEARCH_PAGES.filter(([,n]) => n.toLowerCase().includes(q)).forEach(([r,n]) => hits.push(`<a href="#/${r}"><i></i>${esc(n)}<small>ページ</small></a>`));
  res.innerHTML = hits.join('') || '<a><i></i>見つからなかった</a>';
  res.hidden = false;
});
$('#res').addEventListener('click', () => { $('#res').hidden = true; $('#q').value = ''; $('#q').blur(); });
document.addEventListener('click', e => { if(!e.target.closest('.search')) $('#res').hidden = true; });

(async () => {
  try{ D = await loadData(); }
  catch(err){ console.error(err); $('#app').innerHTML = '<p class="empty" style="padding-top:40px">カードデータを読み込めなかった。開き直してみて。</p>'; return; }
  route();
})();
</script>
